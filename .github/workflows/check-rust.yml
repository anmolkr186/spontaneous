name: Check Rust

# macOS minutes cost 10x on a private repo, so this runs only when Rust changes.
on:
  push:
    branches: ["**"]
    paths:
      - "crates/**"
      - "src-tauri/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/check-rust.yml"

jobs:
  cargo-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-check-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-check-
      - run: npm ci
      # tauri::generate_context! embeds the frontend at compile time.
      - run: npm run build
      - run: cargo check --workspace --locked
