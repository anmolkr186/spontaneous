[package]
name = "spontaneous"
version.workspace = true
description = "Record, annotate and animate UI recordings"
authors = ["Anmol Kumar"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "spontaneous_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json.workspace = true
serde.workspace = true
log.workspace = true
spontaneous-capture = { path = "../crates/capture" }
tauri = { version = "2.12.5", features = ["macos-private-api", "protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
